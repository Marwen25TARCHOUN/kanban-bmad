# Container profile override — AD-15 / Compose named volume `kanban-data` mounted at /data.
#
# AUTO_SERVER=TRUE lets a second process (e.g. the H2 shell) peek at the file without
# wrestling the lock from the Spring process; DB_CLOSE_DELAY=-1 keeps the DB open for the
# container's lifetime so JVM GC never closes it mid-flight.
spring:
  datasource:
    url: jdbc:h2:file:/data/kanban;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
