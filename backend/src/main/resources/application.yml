# Default profile — dev mode (architecture AD-15).
#
# H2 file lives next to the working directory (./kanban.mv.db) so `./mvnw spring-boot:run`
# gives the developer an inspectable file at the repo's backend/ path. CAP-5 / FR-21 / FR-22:
# the board survives shutdown and restart with no configuration step.
server:
  port: 8080

# Anthropic API key — story 5 (CAP-2 / AD-6). Uncomment the placeholder below and export
# `ANTHROPIC_API_KEY` for local dev without Docker; Spring's relaxed binding picks the env var
# up at this property path. The AI bean graph (`AnthropicRestClientConfig`, `AiBreakdownService`,
# `AiBreakdownController`, `AiBreakdownValidator`) only loads when this property resolves to a
# non-blank string — bean absence IS the CAP-7 graceful-degradation signal `GET /api/config`
# reports.
#
# Patch A (review pass 1): do NOT use the `:` colon default here (e.g. `${ANTHROPIC_API_KEY:}`).
# A colon default resolves an unset env var to the empty string, and the SpEL condition on the
# bean graph (`'${anthropic.api-key:}'.trim() != ''`) will still reject it, so the end state is
# honest — but the yml line itself should omit the trap so no future reader "fixes" the
# resolution and reintroduces the empty-string bean-graph load.
# anthropic.api-key: ${ANTHROPIC_API_KEY}

spring:
  application:
    name: kanban
  datasource:
    url: jdbc:h2:file:./kanban;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update   # No Flyway in MVP (spec non-goal); schema evolves with the entity.
    open-in-view: false  # AD-1: entities never leave the service layer.

# Actuator — health only (architecture AD-15, no /env, /beans, /metrics in MVP).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false   # Keep /actuator/health body at `{"status":"UP"}` per acceptance criteria.
