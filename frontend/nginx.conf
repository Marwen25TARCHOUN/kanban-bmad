# nginx server block for the Angular SPA in containerized mode — AD-15.
# Serves the built SPA, routes /api/* to the backend container, enables gzip,
# and sets immutable cache headers for hashed Angular bundles.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compression — cheap win on text payloads
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

  # Reverse proxy for the API — eliminates CORS in containerized mode (AD-12, AD-15).
  # In dev mode (ng serve + mvnw spring-boot:run) the CORS bean in Spring takes over.
  location /api/ {
    proxy_pass         http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Accept-Language   $http_accept_language;

    # AI breakdown can take up to 30s per AD-5 RestClient read timeout; give nginx headroom.
    proxy_connect_timeout 15s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;
  }

  # Immutable cache for hashed Angular bundles + static assets.
  location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback — client-side routes resolve to index.html.
  # index.html itself is never cached long-term (new deploys must propagate).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Health endpoint for liveness probes (optional; Compose uses backend's /actuator/health).
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
